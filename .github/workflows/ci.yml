name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: visitecrm_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visitecrm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/visitecrm_ci
      # Drizzle's static checks must not attempt to provision or connect to a DB.
      DRIZZLE_SCHEMA_ONLY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify API contract code generation is current
        run: pnpm run api:codegen:check

      - name: Validate database schema statically
        run: |
          pnpm --filter @workspace/db run check
          pnpm --filter @workspace/db run validate-coverage
          pnpm --filter @workspace/db run validate-columns
          pnpm --filter @workspace/db run validate-tables

      - name: Apply database migrations for integration tests
        run: |
          pnpm --filter @workspace/db run migrate
          pnpm --filter @workspace/db run verify-clean-migration

      - name: Verify concurrent startup on an empty database
        env:
          MIGRATION_CONCURRENCY_TEST_ADMIN_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @workspace/db run test:migration-concurrency

      - name: Type-check database, API contracts, and API
        run: |
          NODE_OPTIONS=--max-old-space-size=1100 pnpm --filter @workspace/db exec tsc --build
          NODE_OPTIONS=--max-old-space-size=1100 pnpm --filter @workspace/api-zod exec tsc --build
          node lib/api-zod/scripts/compact-dts.mjs
          (
            cd artifacts/api-server
            NODE_OPTIONS=--max-old-space-size=1500 pnpm exec tsc -p tsconfig.check.json
          )

      - name: Type-check API tests
        run: pnpm --filter @workspace/api-server run typecheck:tests

      - name: Type-check API client and frontend
        run: |
          NODE_OPTIONS=--max-old-space-size=1100 pnpm --filter @workspace/shared exec tsc --build
          NODE_OPTIONS=--max-old-space-size=1100 pnpm --filter @workspace/api-client-react exec tsc --build
          NODE_OPTIONS=--max-old-space-size=4096 pnpm --filter @workspace/visitecrm run typecheck

      - name: Test API suite
        run: pnpm --filter @workspace/api-server run test -- --pool=forks --maxWorkers=1 --no-file-parallelism

      - name: Test API integration suite
        run: pnpm --filter @workspace/api-server run test:integration

      - name: Test frontend suite
        run: pnpm --filter @workspace/visitecrm run test -- --pool=forks --maxWorkers=1 --no-file-parallelism

      - name: Verify authenticated frontend role gates on pull requests
        if: github.event_name == 'pull_request'
        run: pnpm --filter @workspace/visitecrm exec vitest run src/__tests__/role-gate.auth.test.tsx --pool=forks --maxWorkers=1 --no-file-parallelism

      - name: Test publication verification
        run: node --test scripts/verify-publication.test.mjs scripts/verify-publication-chunks.test.mjs scripts/verify-referral-publication.test.mjs scripts/promote-verified-main.test.mjs scripts/vercel-ignore-build.test.mjs scripts/frontend-bundle-size.test.mjs

      - name: Check protected publication route coverage
        run: node scripts/verify-publication-chunks.mjs --check-route-coverage

      - name: Type-check mobile artifacts
        run: |
          pnpm --filter @workspace/cliente-app run typecheck
          pnpm --filter @workspace/guide-app run typecheck

      - name: Test mobile behavioral suites on pull requests
        if: github.event_name == 'pull_request'
        run: |
          pnpm --filter @workspace/guide-app test
          pnpm --filter @workspace/cliente-app test

      - name: Build mobile artifacts
        env:
          EXPO_PUBLIC_DOMAIN: visitecrm.com
          EXPO_METRO_PORT: "8082"
        run: |
          pnpm --filter @workspace/cliente-app run build
          pnpm --filter @workspace/guide-app run build

      - name: Build API for production
        run: pnpm --filter @workspace/api-server run build

      - name: Build VisiteCRM frontend and publish bundle budget summary
        env:
          PUBLICATION_VERSION: ${{ github.sha }}
        run: pnpm --filter @workspace/visitecrm run build

      - name: Verify built storefront publication marker
        run: node scripts/publication-marker.mjs artifacts/visitecrm/dist/public/index.html ${{ github.sha }}

      - name: Verify local PR build JavaScript chunks
        if: github.event_name == 'pull_request'
        env:
          PUBLICATION_CHUNK_URL: http://127.0.0.1:4173
          PUBLICATION_CHUNK_SELLER_PATHS: /meu-painel,/vouchers
          PUBLICATION_CHUNK_SUPERADMIN_PATHS: /admin,/admin/tenants
          PUBLICATION_CHUNK_CLIENT_PATHS: /perfil
        run: |
          pnpm --filter @workspace/visitecrm exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          stop_preview() {
            pkill -TERM -P "$preview_pid" 2>/dev/null || true
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap stop_preview EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              echo "Vite preview exited before becoming ready." >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Timed out waiting for Vite preview at 127.0.0.1:4173." >&2
            exit 1
          fi

          node scripts/verify-publication-chunks.mjs --verify-local-build-chunks

  promote:
    name: Promote verified production commit
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      publication_sha: ${{ steps.promote.outputs.publication_sha }}
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify or create a GitHub-signed promotion commit
        id: promote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/promote-verified-main.mjs

  verify-production:
    name: Verify Vercel production publication
    needs:
      - validate
      - promote
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        needs.promote.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the published source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.promote.outputs.publication_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployed Vercel canonical domain
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          PUBLICATION_SMOKE_URL: https://visitecrm.com
          PUBLICATION_CANONICAL_URL: https://visitecrm.com
          # Compare Vercel's marker to the verified promotion commit, not the
          # unsigned source commit that triggered this workflow.
          PUBLICATION_EXPECTED_VERSION: ${{ needs.promote.outputs.publication_sha }}
          # Vercel's Git deployment can start after CI; allow time to build and for the CDN to update.
          PUBLICATION_SMOKE_ATTEMPTS: "90"
          PUBLICATION_SMOKE_RETRY_DELAY_MS: "10000"
        run: node scripts/verify-publication.mjs

      - name: Install Chromium for browser chunk verification
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends chromium

      - name: Verify published JavaScript chunks
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          PUBLICATION_CHUNK_URL: https://visitecrm.com
          # Use one short-lived session per role so role-specific lazy chunks
          # are exercised instead of relying on a single shared session.
          PUBLICATION_CHUNK_SELLER_PATHS: /meu-painel,/vouchers
          PUBLICATION_CHUNK_SUPERADMIN_PATHS: /admin,/admin/tenants
          PUBLICATION_CHUNK_CLIENT_PATHS: /perfil
          PUBLICATION_CHUNK_INTERACTION_SELECTORS: '[role="tab"],button[aria-haspopup="menu"]'
          # CI creates one-use Clerk sign-in tokens (5-minute expiry) for the
          # dedicated role accounts, then revokes each resulting session.
          # No browser cookies or copied Authorization values are stored.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PUBLICATION_CHUNK_SELLER_USER_ID: ${{ vars.PUBLICATION_CHUNK_SELLER_USER_ID }}
          PUBLICATION_CHUNK_SUPERADMIN_USER_ID: ${{ vars.PUBLICATION_CHUNK_SUPERADMIN_USER_ID }}
          PUBLICATION_CHUNK_CLIENT_USER_ID: ${{ vars.PUBLICATION_CHUNK_CLIENT_USER_ID }}
        run: node scripts/verify-publication-chunks.mjs
