          type: ["string", "null"]
        paymentStatus:
          type: ["string", "null"]

    PublicCheckoutBody:
      type: object
      description: Body for POST /public/store/{slug}/orders (vitrine checkout)
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              quantity:
                type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: ["string", "null"]
        customerCpf:
          type: ["string", "null"]
        paymentMethod:
          type: ["string", "null"]
        couponCode:
          type: ["string", "null"]
        referralCode:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        seats:
          type: array
          items:
            type: string
        boardingLocationId:
          type: ["string", "null"]
        depositAmount:
          type: ["number", "null"]
          description: >
            Partial payment amount chosen by the customer. Must be >= store.minDepositAmount
            and <= order total. Rejected when store.minDepositAmount is not configured.
            The order totalAmount is always the full price — depositAmount does NOT overwrite it.
        idempotencyKey:
          type: ["string", "null"]
          description: Client-generated key for idempotent checkout retry (max 128 chars)
      required: [items, customerName, customerEmail]

    PublicStoreOrderResponse:
      type: object
      description: Response from POST /public/store/{slug}/orders (vitrine checkout)
      properties:
        id:
          type: string
        orderNumber:
          type: string
        status:
          type: string
        totalAmount:
          type: number
          description: Full order total (subtotal - discounts). Never overwritten by depositAmount.
        depositAmount:
          type: ["number", "null"]
          description: Amount charged now for partial-payment orders. Null when full payment is due upfront.
        amountRemaining:
          type: ["number", "null"]
          description: Balance owed after deposit (totalAmount - depositAmount). Null when fully paid.
        paymentMethod:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, orderNumber, status, totalAmount, createdAt]

    PublicStoreInfo:
      type: object
      description: Public store configuration returned for vitrine pages
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        minDepositAmount:
          type: ["string", "null"]
          description: >
            Minimum deposit amount (BRL) the store accepts for partial payments.
            Null means full payment is required; when set, customers may pay this amount
            now and the remainder later.
        minOrderValue:
          type: ["string", "null"]
        paymentMethods:
          type: array
          items:
            type: string
        stripeEnabled:
          type: boolean
        maintenanceMode:
          type: boolean
        couponsEnabled:
          type: boolean
        referralsEnabled:
          type: boolean
        seatMapEnabled:
          type: boolean
      required: [id, name, slug, paymentMethods, stripeEnabled, maintenanceMode, couponsEnabled, referralsEnabled, seatMapEnabled]

