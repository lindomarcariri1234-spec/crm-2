  # ─── PUBLIC REFERRAL ROUTES (no auth) ───────────────────────────
  /public/store/{slug}/referral/info:
    get:
      operationId: getPublicReferralInfo
      summary: Get public referral info by code
      tags: [PublicStore]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Referral info
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  referrerName:
                    type: string
                  discountPercent:
                    type: number
                  discountType:
                    type: string
                required: [code, referrerName, discountPercent, discountType]
        "404":
          description: Referral not found

  /public/store/{slug}/referral/validate:
    post:
      operationId: validatePublicReferralCode
      summary: Validate a referral code at checkout
      tags: [PublicStore]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                customerEmail:
                  type: string
                  description: Optional customer email for self-referral prevention check
              required: [code]
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  code:
                    type: string
                  referrerName:
                    type: string
                  discountPercent:
                    type: number
                  discountType:
                    type: string
                  description:
                    type: string
                required: [valid]
        "400":
          description: Invalid code

  /public/store/{slug}/referral/track:
    post:
      operationId: trackPublicReferralVisit
      summary: Track a referral landing page visit
      tags: [PublicStore]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                serverCookieId:
                  type: string
                  description: Previously server-issued tracking cookie ID for return visit recognition
                landingPage:
                  type: string
                utmSource:
                  type: string
                utmMedium:
                  type: string
                utmCampaign:
                  type: string
              required: [code]
      responses:
        "200":
          description: Tracked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookieId:
                    type: string
                  tracked:
                    type: boolean
                required: [cookieId, tracked]

