          type: number
        depositAmount:
          type: ["number", "null"]
          description: Amount the customer chose to pay now (partial payment). Null when full payment is required.
        amountRemaining:
          type: ["number", "null"]
          description: Balance remaining after deposit (totalAmount - depositAmount). Null when fully paid upfront.
        status:
          type: string
        paymentStatus:
          type: string
