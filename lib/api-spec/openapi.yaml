  /calendar/connect:
    get:
      operationId: getCalendarConnectUrl
      summary: Get Google OAuth URL to connect Google Calendar
      tags: [calendar]
      responses:
        "200":
          description: OAuth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarConnectResponse"
        "403":
          description: Forbidden

  /calendar/disconnect:
    post:
      operationId: disconnectCalendar
      summary: Disconnect Google Calendar and revoke tokens
      tags: [calendar]
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /calendar/status:
    get:
      operationId: getCalendarStatus
      summary: Get current Google Calendar connection status
      tags: [calendar]
      responses:
        "200":
          description: Calendar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarStatus"

  /calendar/sync:
    post:
      operationId: syncCalendar
      summary: Trigger manual calendar sync
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSyncRequest"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSyncResponse"
        "400":
          description: Invalid sync type
        "403":
          description: Forbidden
        "404":
          description: Resource not found

  /calendar/callback:
    get:
      tags: [calendar]
      summary: Google OAuth2 callback (server-side redirect handler)
      description: >
        Receives the authorization code from Google after the user grants
        access. Verifies the HMAC-signed `state` parameter, exchanges the
        code for tokens, persists them in the users table, triggers an
        initial syncAll, and redirects back to the Configurações page with
        a `?gcal=connected|denied|error` query parameter.
      parameters:
        - in: query
          name: code
          schema:
            type: string
          description: Authorization code from Google
        - in: query
          name: state
          schema:
            type: string
          description: HMAC-signed state blob (base64url JSON); absent when error is present
        - in: query
          name: error
          schema:
            type: string
          description: Present when the user denied access
      responses:
        "302":
          description: Redirect to frontend with ?gcal=connected|denied|error

