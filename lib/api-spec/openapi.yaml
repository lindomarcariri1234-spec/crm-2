        label:
          type: string
        value:
          type: number
      required: [label, value]

    # ─── TENANT DETAILS ─────────────────────────────────────────────
    TenantDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        email:
          type: string
        whatsapp:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        planId:
          type: string
        status:
          type: string
        cnpj:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zipCode:
          type: ["string", "null"]
        userCount:
          type: integer
        clientCount:
          type: integer
        tripCount:
          type: integer
        reservationCount:
          type: integer
        planMaxUsers:
          type: ["integer", "null"]
        planMaxClients:
          type: ["integer", "null"]
        planMaxTrips:
          type: ["integer", "null"]
        maxUsersOverride:
          type: ["integer", "null"]
        maxClientsOverride:
          type: ["integer", "null"]
        maxTripsOverride:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, slug, email, planId, status, userCount, clientCount, tripCount, reservationCount, createdAt, updatedAt]

    # ─── ADMIN USER ─────────────────────────────────────────────────
    AdminUserItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        tenantId:
          type: ["string", "null"]
        tenantName:
          type: ["string", "null"]
        tenantStatus:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, email, role, isActive, createdAt]

    # ─── AUDIT LOG WITH TENANT ──────────────────────────────────────
    AuditLogWithTenant:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: ["string", "null"]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string
        tenantName:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
      required: [id, tenantId, action, entityType, entityId, createdAt]

    # ─── SUBSCRIPTION ───────────────────────────────────────────────
    Subscription:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        planId:
          type: string
        status:
          type: string
        billingCycle:
          type: string
        currentPeriodStart:
          type: string
        currentPeriodEnd:
          type: string
        cancelAtPeriodEnd:
          type: boolean
        canceledAt:
          type: ["string", "null"]
        trialEnd:
          type: ["string", "null"]
        externalId:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, tenantId, planId, status, billingCycle, currentPeriodStart, currentPeriodEnd, cancelAtPeriodEnd, createdAt, updatedAt]

    # ─── BIRTHDAY ───────────────────────────────────────────────────
    BirthdayMessage:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        clientId:
          type: string
        birthdayYear:
          type: integer
        sentWhatsapp:
          type: boolean
        sentEmail:
          type: boolean
        whatsappSentAt:
          type: ["string", "null"]
        emailSentAt:
          type: ["string", "null"]
        whatsappError:
          type: ["string", "null"]
        emailError:
          type: ["string", "null"]
        couponId:
          type: ["string", "null"]
        couponCode:
          type: ["string", "null"]
        emailOpened:
          type: boolean
        emailOpenedAt:
          type: ["string", "null"]
        converted:
          type: boolean
        isManual:
          type: boolean
        sentById:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, tenantId, clientId, birthdayYear, sentWhatsapp, sentEmail, emailOpened, converted, isManual, createdAt]

    BirthdayClient:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: string
        birthDate:
          type: ["string", "null"]
        whatsappOptIn:
          type: boolean
        emailOptIn:
          type: boolean
        daysUntil:
          type: ["integer", "null"]
        birthdayMessage:
          oneOf:
            - $ref: "#/components/schemas/BirthdayMessage"
            - type: "null"
      required: [id, tenantId, name, email, whatsapp]

    BirthdayHistoryItem:
      allOf:
        - $ref: "#/components/schemas/BirthdayMessage"
        - type: object
          properties:
            client:
              oneOf:
                - $ref: "#/components/schemas/BirthdayClient"
                - type: "null"

    BirthdayStats:
      type: object
      properties:
        totalSentYear:
          type: integer
        sentThisMonth:
          type: integer
        whatsappSent:
          type: integer
        emailSent:
          type: integer
        emailOpened:
          type: integer
        converted:
          type: integer
        conversionRate:
          type: integer
        todayCount:
          type: integer
        upcomingWeek:
          type: integer
        revenueGenerated:
          type: number
      required: [totalSentYear, sentThisMonth, whatsappSent, emailSent, emailOpened, converted, conversionRate, todayCount, upcomingWeek, revenueGenerated]

    BirthdaySendResult:
      type: object
      properties:
        success:
          type: boolean
        couponCode:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
      required: [success]

    BirthdaySettings:
      type: object
      properties:
        enabled:
          type: boolean
        discountPercent:
          type: integer
        validDays:
          type: integer
        sendWhatsapp:
          type: boolean
        sendEmail:
          type: boolean
        whatsappMessage:
          type: ["string", "null"]
        emailSubject:
          type: ["string", "null"]
        emailMessage:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
      required: [enabled, discountPercent, validDays, sendWhatsapp, sendEmail]

    # ─── PLATFORM SETTING ───────────────────────────────────────────
    PlatformSetting:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: ["string", "null"]
        label:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
        updatedAt:
          type: string
      required: [id, key, label, type, updatedAt]

    # ─── GOOGLE CALENDAR ───────────────────────────────────────────
    CalendarConnectResponse:
      type: object
      properties:
        url:
          type: string
      required: [url]

    CalendarStatus:
      type: object
      properties:
        connected:
          type: boolean
        tokenValid:
          type: boolean
        eventsCount:
          type: integer
        lastSync:
          type: ["string", "null"]
      required: [connected, eventsCount]

    CalendarSyncRequest:
      type: object
      properties:
        type:
          type: string
          enum: [all, trip, payment, birthday]
        id:
          type: ["string", "null"]
      required: [type]

    CalendarSyncResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        synced:
          type: integer
      required: [success, message, synced]

    # ─── INSIGHTS ──────────────────────────────────────────────────
    SalesCycleChannelBreakdown:
      type: object
      properties:
        origin:
          type: string
          description: Acquisition channel name (COALESCE'd to "Outros" when null)
        clients:
          type: integer
        avgDaysToPayment:
          type: ["number", "null"]
        avgDaysToTrip:
          type: ["number", "null"]
        conversionRate:
          type: number
          description: Percentage of clients in this channel who made a payment
      required: [origin, clients, conversionRate]

    SalesCycleTrendPoint:
      type: object
      properties:
        month:
          type: string
          description: "ISO month label: YYYY-MM"
        avgDaysToPayment:
          type: ["number", "null"]
        avgDaysToTrip:
          type: ["number", "null"]
      required: [month]

    SalesCycleData:
      type: object
      properties:
        avgDaysToPayment:
          type: ["number", "null"]
          description: Mean days from client registration to first payment
        medianDaysToPayment:
          type: ["number", "null"]
        p25DaysToPayment:
          type: ["number", "null"]
        p75DaysToPayment:
          type: ["number", "null"]
        avgDaysToTrip:
          type: ["number", "null"]
          description: Mean days from client registration to first confirmed trip departure
        medianDaysToTrip:
          type: ["number", "null"]
        totalClients:
          type: integer
          description: Number of clients registered in the selected period
        clientsWithPayment:
          type: integer
          description: Subset of totalClients who made at least one payment
        byChannel:
          type: array
          items:
            $ref: "#/components/schemas/SalesCycleChannelBreakdown"
        trend:
          type: array
          description: Last 12 months, gap-filled with null for months with no data
          items:
            $ref: "#/components/schemas/SalesCycleTrendPoint"
      required: [totalClients, clientsWithPayment, byChannel, trend]

openapi: 3.1.0

paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded (Redis disconnected or BullMQ workers not running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /healthz:
    get:
      operationId: healthCheckLegacy
      tags: [health]
      summary: Health check (legacy alias)
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded (Redis disconnected or BullMQ workers not running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── ADMIN ───────────────────────────────────────────────────────
  /admin/system-health:
    get:
      operationId: getSystemHealth
      tags: [admin]
      summary: Get system health status (superadmin only)
      responses:
        "200":
          description: System health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get global platform stats (superadmin only)
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/invoices:
    get:
      operationId: listAdminInvoices
      tags: [admin]
      summary: List all invoices (superadmin only)
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceWithTenant"
    post:
      operationId: createAdminInvoice
      tags: [admin]
      summary: Create a new invoice (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /admin/invoices/{id}:
    patch:
      operationId: updateAdminInvoice
      tags: [admin]
      summary: Update an invoice (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceBody"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /admin/feature-flags:
    get:
      operationId: listFeatureFlags
      tags: [admin]
      summary: List feature flags (superadmin only)
      responses:
        "200":
          description: Feature flag list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlag"
    post:
      operationId: createFeatureFlag
      tags: [admin]
      summary: Create a feature flag (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeatureFlagBody"
      responses:
        "201":
          description: Created feature flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"

  /admin/feature-flags/{id}:
    patch:
      operationId: updateFeatureFlag
      tags: [admin]
      summary: Update a feature flag (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeatureFlagBody"
      responses:
        "200":
          description: Updated feature flag
          content:
