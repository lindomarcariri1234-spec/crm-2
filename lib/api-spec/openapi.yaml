components:
  schemas:
    ReservationStatus:
      type: string
      enum: [pending, confirmed, cancelled, refunded, completed, failed]
    PaymentStatus:
      type: string
      enum: [pending, paid, overdue, cancelled, approved, failed, refunded, charged_back]
    PaymentType:
      type: string
      enum: [receivable, payable]
    CommissionStatus:
      type: string
      enum: [pending, approved, paid, cancelled]
    DealStatus:
      type: string
      enum: [open, won, lost]
    TripStatus:
      type: string
      enum: [draft, published, active, confirmed, cancelled, completed]
    Role:
      type: string
      enum: [superadmin, agencia, gerente, vendedor, suporte, cliente]
    ExpenseStatus:
      type: string
      enum: [pending, paid, overdue, cancelled]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: object
          properties:
            connected:
              type: boolean
          required: [connected]
        redis:
          type: object
          properties:
            connected:
              type: boolean
            configured:
              type: boolean
          required: [connected, configured]
        bullmq:
          type: object
          properties:
            active:
              type: boolean
            workers:
              type: object
              properties:
                email:
                  type: boolean
                reminder:
                  type: boolean
                pdf:
                  type: boolean
                commissionSync:
                  type: boolean
