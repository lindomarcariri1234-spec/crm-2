        isFeatured:
          type: boolean

    # ─── INVOICES ───────────────────────────────────────────────────
    Invoice:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        planId:
          type: ["string", "null"]
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
        dueDate:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, tenantId, amount, currency, status, createdAt, updatedAt]

    InvoiceWithTenant:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        planId:
          type: ["string", "null"]
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
        dueDate:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
        tenantName:
          type: ["string", "null"]
      required: [id, tenantId, amount, currency, status, createdAt, updatedAt]

    CreateInvoiceBody:
      type: object
      properties:
        tenantId:
          type: string
        planId:
          type: string
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
        dueDate:
          type: string
        description:
          type: string
        notes:
          type: string
      required: [tenantId, amount]

    UpdateInvoiceBody:
      type: object
      properties:
        status:
          type: string
        paidAt:
          type: string
        notes:
          type: string
        amount:
          type: string
        dueDate:
          type: string

    # ─── FEATURE FLAGS ──────────────────────────────────────────────
    FeatureFlag:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        isEnabled:
          type: boolean
        rolloutPercent:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, key, name, isEnabled, rolloutPercent, createdAt, updatedAt]

    CreateFeatureFlagBody:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        rolloutPercent:
          type: integer
      required: [key, name]

    UpdateFeatureFlagBody:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        isEnabled:
          type: boolean
        rolloutPercent:
          type: integer

    # ─── METRICS ────────────────────────────────────────────────────
    MetricPoint:
      type: object
      properties:
        label:
          type: string
        value:
          type: number
      required: [label, value]

    # ─── TENANT DETAILS ─────────────────────────────────────────────
    TenantDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        email:
          type: string
        whatsapp:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        planId:
          type: string
        status:
          type: string
        cnpj:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zipCode:
          type: ["string", "null"]
        userCount:
          type: integer
        clientCount:
          type: integer
        tripCount:
          type: integer
        reservationCount:
          type: integer
        planMaxUsers:
          type: ["integer", "null"]
        planMaxClients:
          type: ["integer", "null"]
        planMaxTrips:
          type: ["integer", "null"]
        maxUsersOverride:
          type: ["integer", "null"]
        maxClientsOverride:
          type: ["integer", "null"]
        maxTripsOverride:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, slug, email, planId, status, userCount, clientCount, tripCount, reservationCount, createdAt, updatedAt]

    # ─── ADMIN USER ─────────────────────────────────────────────────
    AdminUserItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        tenantId:
          type: ["string", "null"]
        tenantName:
          type: ["string", "null"]
        tenantStatus:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, name, email, role, isActive, createdAt]

    # ─── AUDIT LOG WITH TENANT ──────────────────────────────────────
    AuditLogWithTenant:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        userId:
          type: ["string", "null"]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
        before:
          type: object
          nullable: true
        after:
          type: object
          nullable: true
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string
        tenantName:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
      required: [id, tenantId, action, entityType, entityId, createdAt]

    # ─── SUBSCRIPTION ───────────────────────────────────────────────
    Subscription:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        planId:
          type: string
        status:
          type: string
        billingCycle:
          type: string
        currentPeriodStart:
          type: string
        currentPeriodEnd:
          type: string
        cancelAtPeriodEnd:
          type: boolean
        canceledAt:
          type: ["string", "null"]
        trialEnd:
          type: ["string", "null"]
        externalId:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, tenantId, planId, status, billingCycle, currentPeriodStart, currentPeriodEnd, cancelAtPeriodEnd, createdAt, updatedAt]

    # ─── BIRTHDAY ───────────────────────────────────────────────────
    BirthdayMessage:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        clientId:
          type: string
        birthdayYear:
          type: integer
        sentWhatsapp:
          type: boolean
        sentEmail:
          type: boolean
        whatsappSentAt:
          type: ["string", "null"]
        emailSentAt:
          type: ["string", "null"]
        whatsappError:
          type: ["string", "null"]
        emailError:
          type: ["string", "null"]
        couponId:
          type: ["string", "null"]
        couponCode:
          type: ["string", "null"]
        emailOpened:
          type: boolean
        emailOpenedAt:
          type: ["string", "null"]
        converted:
          type: boolean
        isManual:
          type: boolean
        sentById:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, tenantId, clientId, birthdayYear, sentWhatsapp, sentEmail, emailOpened, converted, isManual, createdAt]

    BirthdayClient:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        email:
          type: string
        whatsapp:
          type: string
        birthDate:
          type: ["string", "null"]
        whatsappOptIn:
          type: boolean
        emailOptIn:
          type: boolean
        daysUntil:
          type: ["integer", "null"]
        birthdayMessage:
          oneOf:
            - $ref: "#/components/schemas/BirthdayMessage"
            - type: "null"
      required: [id, tenantId, name, email, whatsapp]

    BirthdayHistoryItem:
      allOf:
        - $ref: "#/components/schemas/BirthdayMessage"
        - type: object
          properties:
            client:
              oneOf:
                - $ref: "#/components/schemas/BirthdayClient"
                - type: "null"

    BirthdayStats:
      type: object
      properties:
        totalSentYear:
          type: integer
        sentThisMonth:
          type: integer
        whatsappSent:
          type: integer
        emailSent:
          type: integer
        emailOpened:
          type: integer
        converted:
          type: integer
        conversionRate:
          type: integer
        todayCount:
          type: integer
        upcomingWeek:
          type: integer
        revenueGenerated:
          type: number
      required: [totalSentYear, sentThisMonth, whatsappSent, emailSent, emailOpened, converted, conversionRate, todayCount, upcomingWeek, revenueGenerated]

    BirthdaySendResult:
      type: object
      properties:
        success:
          type: boolean
        couponCode:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
      required: [success]

    BirthdaySettings:
      type: object
      properties:
        enabled:
          type: boolean
        discountPercent:
          type: integer
        validDays:
          type: integer
        sendWhatsapp:
          type: boolean
        sendEmail:
          type: boolean
        whatsappMessage:
          type: ["string", "null"]
        emailSubject:
          type: ["string", "null"]
        emailMessage:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
      required: [enabled, discountPercent, validDays, sendWhatsapp, sendEmail]

    # ─── PLATFORM SETTING ───────────────────────────────────────────
    PlatformSetting:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: ["string", "null"]
        label:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
        updatedAt:
          type: string
      required: [id, key, label, type, updatedAt]

    # ─── GOOGLE CALENDAR ───────────────────────────────────────────
    CalendarConnectResponse:
      type: object
      properties:
        url:
          type: string
      required: [url]

    CalendarStatus:
      type: object
      properties:
        connected:
          type: boolean
        tokenValid:
          type: boolean
        eventsCount:
          type: integer
        lastSync:
          type: ["string", "null"]
      required: [connected, eventsCount]

    CalendarSyncRequest:
      type: object
      properties:
        type:
          type: string
          enum: [all, trip, payment, birthday]
        id:
          type: ["string", "null"]
      required: [type]

    CalendarSyncResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        synced:
          type: integer
      required: [success, message, synced]

info:
  title: Api
  version: 0.1.0
  description: VisiteCRM API - SaaS CRM for tourism agencies
