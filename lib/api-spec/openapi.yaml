openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: VisiteCRM API - SaaS CRM for tourism agencies
servers:
  - url: /api
    description: Base API path
tags:
  - name: admin
    description: Super admin global operations
  - name: health
    description: Health operations
  - name: tenants
    description: Multi-tenancy operations
  - name: users
    description: User management
  - name: clients
    description: Client (CRM) operations
  - name: trips
    description: Trip management
  - name: reservations
    description: Reservation management
  - name: passengers
    description: Passenger management
  - name: payments
    description: Payment management
  - name: expenses
    description: Expense management
  - name: deals
    description: Pipeline/Deal management
  - name: messages
    description: Communication
  - name: templates
    description: Message templates
  - name: automations
    description: Automation rules
  - name: suppliers
    description: Supplier management
  - name: vehicles
    description: Vehicle management
  - name: accommodations
    description: Accommodation management
  - name: destinations
    description: Destination management
  - name: products
    description: Marketplace products
  - name: orders
    description: Marketplace orders
  - name: campaigns
    description: Marketing campaigns
  - name: Birthday
    description: Birthday message automation
  - name: loyalty
    description: Loyalty programs
  - name: nps
    description: NPS responses
  - name: dashboard
    description: Dashboard summary data
  - name: notes
    description: Client notes

paths:
  /health:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded (Redis disconnected or BullMQ workers not running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /healthz:
    get:
      operationId: healthCheckLegacy
      tags: [health]
      summary: Health check (legacy alias)
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded (Redis disconnected or BullMQ workers not running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── ADMIN ───────────────────────────────────────────────────────
  /admin/system-health:
    get:
      operationId: getSystemHealth
      tags: [admin]
      summary: Get system health status (superadmin only)
      responses:
        "200":
          description: System health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"

  /admin/system-health/repair:
    post:
      operationId: repairSystemHealth
      tags: [admin]
      summary: Repair pipeline orphan deals and seat counter drift (superadmin only)
      responses:
        "200":
          description: Repair result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairSystemHealth"

  /admin/system-health/repair-seat-drift:
    post:
      operationId: repairSeatDrift
      tags: [admin]
      summary: Repair seat counter drift (superadmin only)
      responses:
        "200":
          description: Repair result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairSeatDrift"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get global platform stats (superadmin only)
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/invoices:
    get:
      operationId: listAdminInvoices
      tags: [admin]
      summary: List all invoices (superadmin only)
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoice list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceWithTenant"
    post:
      operationId: createAdminInvoice
      tags: [admin]
      summary: Create a new invoice (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /admin/invoices/{id}:
    patch:
      operationId: updateAdminInvoice
      tags: [admin]
      summary: Update an invoice (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceBody"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /admin/feature-flags:
    get:
      operationId: listFeatureFlags
      tags: [admin]
      summary: List feature flags (superadmin only)
      responses:
        "200":
          description: Feature flag list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureFlag"
    post:
      operationId: createFeatureFlag
      tags: [admin]
      summary: Create a feature flag (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeatureFlagBody"
      responses:
        "201":
          description: Created feature flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"

  /admin/feature-flags/{id}:
    patch:
      operationId: updateFeatureFlag
      tags: [admin]
      summary: Update a feature flag (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFeatureFlagBody"
      responses:
        "200":
          description: Updated feature flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"

  /admin/metrics/mrr:
    get:
      operationId: getMetricsMrr
      tags: [admin]
      summary: Get historical MRR series (superadmin only)
      responses:
        "200":
          description: MRR series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  /admin/metrics/churn:
    get:
      operationId: getMetricsChurn
      tags: [admin]
      summary: Get historical churn rate series (superadmin only)
      responses:
        "200":
          description: Churn series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  /admin/metrics/growth:
    get:
      operationId: getMetricsGrowth
      tags: [admin]
      summary: Get historical agency growth series (superadmin only)
      responses:
        "200":
          description: Growth series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetricPoint"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all platform users (superadmin only)
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserItem"

  /admin/platform-settings:
    get:
      operationId: listPlatformSettings
      tags: [admin]
      summary: List all platform settings (superadmin only)
      responses:
        "200":
          description: Platform settings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformSetting"

  /admin/platform-settings/{key}:
    put:
      operationId: updatePlatformSetting
      tags: [admin]
      summary: Update a platform setting value (superadmin only)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: ["string", "null"]
              required: [value]
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSetting"

  /admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      tags: [admin]
      summary: List all audit logs (superadmin only)
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogWithTenant"

  /plans:
    get:
      operationId: listPlans
      tags: [admin]
      summary: List all plans (superadmin only)
      responses:
        "200":
          description: Plan list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [admin]
      summary: Create a plan (superadmin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanBody"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /plans/{id}:
    get:
      operationId: getPlan
      tags: [admin]
      summary: Get plan by ID (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    patch:
      operationId: updatePlan
      tags: [admin]
      summary: Update a plan (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanBody"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: archivePlan
      tags: [admin]
      summary: Archive a plan (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /tenants/{id}/details:
    get:
      operationId: getTenantDetails
      tags: [tenants]
      summary: Get detailed tenant info with counts (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetails"

  /tenants/{id}/users:
    get:
      operationId: listTenantUsers
      tags: [tenants]
      summary: List users of a tenant (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /tenants/{id}/suspend:
    post:
      operationId: suspendTenant
      tags: [tenants]
      summary: Suspend a tenant (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}/activate:
    post:
      operationId: activateTenant
      tags: [tenants]
      summary: Activate a tenant (superadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  # ─── DASHBOARD ───────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/revenue-chart:
    get:
      operationId: getDashboardRevenueChart
      tags: [dashboard]
      summary: Get revenue chart data
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, 12m]
            default: 30d
      responses:
        "200":
          description: Revenue chart data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartDataPoint"

  /dashboard/upcoming-trips:
    get:
      operationId: getDashboardUpcomingTrips
      tags: [dashboard]
      summary: Get upcoming trips for dashboard
      responses:
        "200":
          description: Upcoming trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripSummary"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/charts:
    get:
      operationId: getDashboardCharts
      tags: [dashboard]
      summary: Get dashboard chart data (top destinations, monthly series, funnel metrics)
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [3m, 6m, 12m]
            default: "12m"
          description: "Time period for monthly series (default: 12m)"
      responses:
        "200":
          description: Dashboard charts data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCharts"

  /dashboard/funnel:
    get:
      operationId: getDashboardFunnel
      tags: [dashboard]
      summary: Get conversion funnel data
      responses:
        "200":
          description: Funnel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFunnel"

  # ─── INSIGHTS ────────────────────────────────────────────────────
  /insights/sales-cycle:
    get:
      operationId: getSalesCycle
      tags: [insights]
      summary: Get sales cycle metrics (days from registration to payment and trip)
      description: |
        Returns aggregate, channel-breakdown, and 12-month trend data showing
        how many days elapse from client registration to their first payment
        and first confirmed trip departure.
        Requires authentication. SALES and CLIENT roles are blocked (403).
      parameters:
        - name: period
          in: query
          description: Lookback window for clients included in the analysis
          schema:
            type: string
            enum: [30d, 90d, 12m]
            default: 12m
      responses:
        "200":
          description: Sales cycle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesCycleData"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (SALES or CLIENT role)

  # ─── CLIENTS ─────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: pipelineStage
          in: query
          schema:
            type: ["string", "null"]
        - name: classification
          in: query
          schema:
            type: ["string", "null"]
        - name: city
          in: query
          schema:
            type: ["string", "null"]
        - name: tripId
          in: query
          schema:
            type: ["string", "null"]
        - name: sellerId
          in: query
          schema:
            type: ["string", "null"]
        - name: origin
          in: query
          schema:
            type: ["string", "null"]
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - name: sortBy
          in: query
          schema:
            type: ["string", "null"]
        - name: sortOrder
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResponse"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /clients/{id}/loyalty:
    get:
      operationId: getClientLoyalty
      tags: [clients]
      summary: Get loyalty info for a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Loyalty info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientLoyaltyInfo"
        "404":
          description: Not a loyalty member

  /clients/{id}/pipeline-stage:
    patch:
      operationId: updateClientPipelineStage
      tags: [clients]
      summary: Move client in pipeline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
              required: [stage]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  # ─── NOTES ───────────────────────────────────────────────────────
  /clients/{clientId}/activities:
    get:
      operationId: listClientActivities
      tags: [clients]
      summary: List client activities (timeline)
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientActivity"
    post:
      operationId: createClientActivity
      tags: [clients]
      summary: Create a manual activity
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientActivityBody"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientActivity"

  /clients/{clientId}/notes:
    get:
      operationId: listClientNotes
      tags: [notes]
      summary: List client notes
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createClientNote
      tags: [notes]
      summary: Create a note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteBody"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /clients/{clientId}/notes/{noteId}:
    delete:
      operationId: deleteClientNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /clients/{clientId}/referral:
    get:
      operationId: getClientReferral
      summary: Get referral info and history for a client
      tags: [Clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client referral info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientReferralInfo"

  /clients/{clientId}/referral/generate:
    post:
      operationId: generateClientReferralCode
      summary: Generate or return existing referral code for a client
      tags: [Clients]
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated referral code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                required: [code]

  # ─── REFERRAL SETTINGS ─────────────────────────────────────────────
  /referral-settings:
    get:
      operationId: getReferralSettings
      summary: Get referral program settings for the tenant
      tags: [Referrals]
      responses:
        "200":
          description: Referral settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSettings"
    patch:
      operationId: updateReferralSettings
      summary: Update referral program settings
      tags: [Referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReferralSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralSettings"

  # ─── LAYOUTS ─────────────────────────────────────────────────────
  /layouts:
    get:
      operationId: listLayouts
      tags: [layouts]
