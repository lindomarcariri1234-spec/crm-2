        todayCount:
          type: integer
        upcomingWeek:
          type: integer
        revenueGenerated:
          type: number
      required: [totalSentYear, sentThisMonth, whatsappSent, emailSent, emailOpened, converted, conversionRate, todayCount, upcomingWeek, revenueGenerated]

    BirthdaySendResult:
      type: object
      properties:
        success:
          type: boolean
        couponCode:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
      required: [success]

    BirthdaySettings:
      type: object
      properties:
        enabled:
          type: boolean
        discountPercent:
          type: integer
        validDays:
          type: integer
        sendWhatsapp:
          type: boolean
        sendEmail:
          type: boolean
        whatsappMessage:
          type: ["string", "null"]
        emailSubject:
          type: ["string", "null"]
        emailMessage:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
      required: [enabled, discountPercent, validDays, sendWhatsapp, sendEmail]

    # ─── PLATFORM SETTING ───────────────────────────────────────────
    PlatformSetting:
      type: object
      properties:
        id:
          type: string
        key:
          type: string
        value:
          type: ["string", "null"]
        fallbackValue:
          type: ["string", "null"]
        label:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
        updatedAt:
          type: string
      required: [id, key, label, type, updatedAt]

    # ─── GOOGLE CALENDAR ───────────────────────────────────────────
    CalendarConnectResponse:
      type: object
      properties:
        url:
          type: string
      required: [url]

    CalendarStatus:
      type: object
      properties:
        connected:
          type: boolean
        tokenValid:
          type: boolean
        eventsCount:
          type: integer
        lastSync:
          type: ["string", "null"]
      required: [connected, eventsCount]

    CalendarSyncRequest:
      type: object
      properties:
        type:
          type: string
          enum: [all, trip, payment, birthday]
        id:
          type: ["string", "null"]
      required: [type]

    CalendarSyncResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        synced:
          type: integer
      required: [success, message, synced]

