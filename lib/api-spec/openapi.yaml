          type: string
        totalAmount:
          type: number
          description: Full order total (subtotal - discounts). Not overwritten by depositAmount.
        finalAmount:
          type: number
        depositAmount:
          type: ["number", "null"]
          description: Amount the customer chose to pay now (partial payment). Null when full payment is required.
        amountRemaining:
          type: ["number", "null"]
          description: Balance remaining after deposit (totalAmount - depositAmount). Null when fully paid upfront.
        status:
          type: string
        paymentStatus:
          type: string
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
      required: [id, userId, totalAmount, finalAmount, status, paymentStatus, createdAt, items]

    OrderItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        quantity:
          type: integer
        price:
          type: number
        productName:
          type: ["string", "null"]
      required: [id, productId, quantity, price]

